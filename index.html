<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="hearts-bg" id="heartsBackground"></div>
    
    <div class="container">
        <div class="question-section" id="questionSection">
            <h1>Will You Be My Valentine?</h1>
            <p class="subtitle">A simple question from the heart</p>
            
            <div class="buttons-container">
                <button class="btn btn-yes" id="yesBtn">Yes ❤️</button>
                <button class="btn btn-no" id="noBtn">No 😅</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
